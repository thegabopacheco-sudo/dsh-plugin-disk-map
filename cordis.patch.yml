# dsh-plugin-disk-map — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "diskmap".
# Tools resultantes: mcp__diskmap__* (ver README).
- insert:
    - id: mcp-disk-map
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: diskmap
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/disk-map/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
